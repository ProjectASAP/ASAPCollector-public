name: Nightly - ASAP Sketches
methodology: otel-arrow-pipeline-perf-test
topology:
  load-generator:
    data_source: semantic_conventions
    metric: http.server.request.duration
    attributes:
      - http.request.method
      - http.route
      - http.response.status_code
      - service.name
    generation_strategy: pre_generated
    input_batch_size: 4096
    value_distribution: deterministic_high_diversity_with_5_percent_slow_tail
    batch_sizes: [1024, 16384, 131072]
  systems-under-test:
    - name: otap_control_pipeline
      operation: raw-pass-through
    - name: otap_exact_quantile_pipeline
      operation: collect-sort-estimate
      quantiles: [0.5, 0.99]
    - name: asap_kll_pipeline
      processor: urn:asap:processor:asap_sketches
      sketch: kll
      k: 200
      shards: 4
      operation: create-merge-estimate
  simulated-backend:
    assertions:
      quantiles: [0.5, 0.99]
      maximum_relative_error: 0.05
comparisons:
  - otap_control_pipeline
  - otap_exact_quantile_pipeline
  - asap_kll_pipeline
measurements:
  - signals_per_second
  - wall_time
  - user_cpu_time
  - system_cpu_time
  - cpu_percent
  - maximum_resident_set_size
profiling:
  criterion: target/criterion
  symbols: strip-none
  follow_up: samply-or-otap-pprof
limitations:
  - internal Criterion replica; not yet published by the upstream shared runner
  - processor workloads run over native OtapPdata in the Criterion process; they are not yet deployed as full RuntimePipeline graphs
  - peak RSS includes the Criterion harness, OTAP dependencies, and generated input, not only processor state
  - traffic is pre-generated from the semantic-convention schema rather than the future annotation-generated SDK
