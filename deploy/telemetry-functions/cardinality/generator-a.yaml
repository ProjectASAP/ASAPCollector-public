# Source a: four attributes with known cardinality behaviour. The rate per
# source ramps up and back down every 40 minutes, again and again, so the three
# pipelines can be compared as load rises and falls: 5k -> 10k -> 20k -> 40k ->
# 80k -> 40k -> 20k -> 10k points/s, 5 minutes each. Once: at minute 10
# http.route explodes from 20 to 20,000 values (as when an ID leaks into the
# route).
version: otel_dataflow/v1
engine:
  http_admin:
    bind_address: 0.0.0.0:8085
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
groups:
  default:
    pipelines:
      main:
        nodes:
          generator:
            type: urn:asap:receiver:scenario_generator
            config:
              seed: 1
              signals_per_second: 5000
              metric_name: http.server.request.duration
              resource_attributes: {service.name: checkout, source: "a"}
              attributes:
                - {key: http.route, cardinality: 20, zipf: 1.1}      # stable
                - {key: http.method, cardinality: 5}                  # stable
                - {key: k8s.pod.name, cardinality: 50, growth_per_minute: 0.05}  # growing
                - {key: user.id, unique: true}                        # identifier-like
              value: {lognormal: {median: 50.0, sigma: 0.6}}
              # The rate ramps up and back down every 40 minutes, again and again.
              rate_cycle_seconds: 2400
              changes:
                - {after_seconds: 300, signals_per_second: 10000}
                - {after_seconds: 600, signals_per_second: 20000}
                - {after_seconds: 900, signals_per_second: 40000}
                - {after_seconds: 1200, signals_per_second: 80000}
                - {after_seconds: 1500, signals_per_second: 40000}
                - {after_seconds: 1800, signals_per_second: 20000}
                - {after_seconds: 2100, signals_per_second: 10000}
                - {after_seconds: 600, attribute: http.route, cardinality: 20000}
          export:
            type: exporter:otlp_http
            config:
              endpoint: http://downstream:4318
              client_pool_size: 1
              max_in_flight: 1
              http: {timeout: 30s, compression: none}
        connections:
          - {from: generator, to: export}
