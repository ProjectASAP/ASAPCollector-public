# Every pipeline stage is the official OTAP engine (asap-collector) in its
# own container, pinned to one CPU, talking OTLP/HTTP over the compose
# network. Prometheus, Grafana and Loki are the observers.
# USE_CASE picks the pipelines directory (latency, cardinality, ...);
# CPU_* variables move a stage to another core.
x-collector: &collector
  image: asap-collector:local
  restart: "no"

services:
  generator-a:
    <<: *collector
    command: ["--config", "/pipelines/generator-a.yaml"]
    volumes: ["./${USE_CASE:-latency}:/pipelines:ro"]
    cpuset: "${CPU_GENERATOR_A:-0}"
    depends_on: [branch-a]
  generator-b:
    <<: *collector
    command: ["--config", "/pipelines/generator-b.yaml"]
    volumes: ["./${USE_CASE:-latency}:/pipelines:ro"]
    cpuset: "${CPU_GENERATOR_B:-1}"
    depends_on: [branch-b]
  branch-a:
    <<: *collector
    command: ["--config", "/pipelines/branch.yaml"]
    volumes: ["./${USE_CASE:-latency}:/pipelines:ro"]
    cpuset: "${CPU_BRANCH_A:-2}"
    depends_on: [merge, exact]
  branch-b:
    <<: *collector
    command: ["--config", "/pipelines/branch.yaml"]
    volumes: ["./${USE_CASE:-latency}:/pipelines:ro"]
    cpuset: "${CPU_BRANCH_B:-3}"
    depends_on: [merge, exact]
  merge:
    <<: *collector
    command: ["--config", "/pipelines/merge.yaml"]
    volumes: ["./${USE_CASE:-latency}:/pipelines:ro"]
    cpuset: "${CPU_MERGE:-4}"
    depends_on: [detector]
  detector:
    <<: *collector
    command: ["--config", "/pipelines/detector.yaml"]
    volumes: ["./${USE_CASE:-latency}:/pipelines:ro"]
    cpuset: "${CPU_DETECTOR:-5}"
    depends_on: [prometheus]
  exact:
    <<: *collector
    command: ["--config", "/pipelines/exact.yaml"]
    volumes: ["./${USE_CASE:-latency}:/pipelines:ro"]
    cpuset: "${CPU_EXACT:-6}"
    depends_on: [prometheus]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:12.1.0
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
