# Three pipelines over the same generated input, sharing no processor:
#   sketch: generator-a/b -> branch-a/b (sketch) -> merge -> detector
#   exact:  exact-generator-a/b -> exact-branch-a/b (exact window) ->
#           exact-merge -> exact-detector
#   store and query (raw): raw-generator-a/b -> raw-sink-a/b (every raw point
#           into loki-raw); query-job computes the answer from loki-raw
# hh-accuracy sits outside the pipelines: in the top-k use case both detectors
# send it a copy of their answers, and it reports heavy-hitter accuracy.
# query-job also times each approach's backend query (Prometheus or Loki).
# Each stage is the official OTAP engine (asap-collector) in its own container,
# pinned to one CPU, talking OTLP/HTTP over the compose network. The generators
# of a source share one config (`downstream` is their pipeline's first stage)
# and SCENARIO_START, so all three pipelines get identical points.
# PIPELINES is the use case's stage-config directory (run.sh sets it from
# USE_CASE), COMMON the stages every use case shares; CPU_* variables move a
# stage to another core. Prometheus and Loki are the observers; Grafana is shared (grafana-compose.yaml).
x-collector: &collector
  image: asap-collector:local
  restart: "no"
x-generator: &generator
  <<: *collector
  environment:
    ASAP_SCENARIO_START: "${SCENARIO_START:-}"

services:
  # sketch pipeline
  generator-a:
    <<: *generator
    command: ["--config", "/pipelines/generator-a.yaml"]
    volumes: ["${PIPELINES:-./latency}:/pipelines:ro", "${COMMON:-./common}:/common:ro"]
    cpuset: "${CPU_GENERATOR_A:-0}"
    links: ["branch-a:downstream"]
    depends_on: [branch-a]
  generator-b:
    <<: *generator
    command: ["--config", "/pipelines/generator-b.yaml"]
    volumes: ["${PIPELINES:-./latency}:/pipelines:ro", "${COMMON:-./common}:/common:ro"]
    cpuset: "${CPU_GENERATOR_B:-1}"
    links: ["branch-b:downstream"]
    depends_on: [branch-b]
  branch-a:
    <<: *collector
    command: ["--config", "/pipelines/branch.yaml"]
    volumes: ["${PIPELINES:-./latency}:/pipelines:ro", "${COMMON:-./common}:/common:ro"]
    cpuset: "${CPU_BRANCH_A:-2}"
    depends_on: [merge]
  branch-b:
    <<: *collector
    command: ["--config", "/pipelines/branch.yaml"]
    volumes: ["${PIPELINES:-./latency}:/pipelines:ro", "${COMMON:-./common}:/common:ro"]
    cpuset: "${CPU_BRANCH_B:-3}"
    depends_on: [merge]
  merge:
    <<: *collector
    command: ["--config", "/pipelines/merge.yaml"]
    volumes: ["${PIPELINES:-./latency}:/pipelines:ro", "${COMMON:-./common}:/common:ro"]
    cpuset: "${CPU_MERGE:-4}"
    depends_on: [detector]
  detector:
    <<: *collector
    command: ["--config", "/pipelines/detector.yaml"]
    volumes: ["${PIPELINES:-./latency}:/pipelines:ro", "${COMMON:-./common}:/common:ro"]
    cpuset: "${CPU_DETECTOR:-5}"
    depends_on: [prometheus, hh-accuracy]
  # exact pipeline
  exact-generator-a:
    <<: *generator
    command: ["--config", "/pipelines/generator-a.yaml"]
    volumes: ["${PIPELINES:-./latency}:/pipelines:ro", "${COMMON:-./common}:/common:ro"]
    cpuset: "${CPU_EXACT_GENERATOR_A:-6}"
    links: ["exact-branch-a:downstream"]
    depends_on: [exact-branch-a]
  exact-generator-b:
    <<: *generator
    command: ["--config", "/pipelines/generator-b.yaml"]
    volumes: ["${PIPELINES:-./latency}:/pipelines:ro", "${COMMON:-./common}:/common:ro"]
    cpuset: "${CPU_EXACT_GENERATOR_B:-7}"
    links: ["exact-branch-b:downstream"]
    depends_on: [exact-branch-b]
  exact-branch-a:
    <<: *collector
    command: ["--config", "/pipelines/exact-branch.yaml"]
    volumes: ["${PIPELINES:-./latency}:/pipelines:ro", "${COMMON:-./common}:/common:ro"]
    cpuset: "${CPU_EXACT_BRANCH_A:-8}"
    depends_on: [exact-merge]
  exact-branch-b:
    <<: *collector
    command: ["--config", "/pipelines/exact-branch.yaml"]
    volumes: ["${PIPELINES:-./latency}:/pipelines:ro", "${COMMON:-./common}:/common:ro"]
    cpuset: "${CPU_EXACT_BRANCH_B:-9}"
    depends_on: [exact-merge]
  exact-merge:
    <<: *collector
    command: ["--config", "/common/exact-merge.yaml"]
    volumes: ["${PIPELINES:-./latency}:/pipelines:ro", "${COMMON:-./common}:/common:ro"]
    cpuset: "${CPU_EXACT_MERGE:-10}"
    depends_on: [exact-detector]
  exact-detector:
    <<: *collector
    command: ["--config", "/pipelines/exact-detector.yaml"]
    volumes: ["${PIPELINES:-./latency}:/pipelines:ro", "${COMMON:-./common}:/common:ro"]
    cpuset: "${CPU_EXACT_DETECTOR:-11}"
    depends_on: [prometheus, hh-accuracy]
  # store-and-query pipeline: one stage per source, then the query job
  raw-generator-a:
    <<: *generator
    command: ["--config", "/pipelines/generator-a.yaml"]
    volumes: ["${PIPELINES:-./latency}:/pipelines:ro", "${COMMON:-./common}:/common:ro"]
    cpuset: "${CPU_RAW_GENERATOR_A:-12}"
    links: ["raw-sink-a:downstream"]
    depends_on: [raw-sink-a]
  raw-generator-b:
    <<: *generator
    command: ["--config", "/pipelines/generator-b.yaml"]
    volumes: ["${PIPELINES:-./latency}:/pipelines:ro", "${COMMON:-./common}:/common:ro"]
    cpuset: "${CPU_RAW_GENERATOR_B:-13}"
    links: ["raw-sink-b:downstream"]
    depends_on: [raw-sink-b]
  raw-sink-a:
    <<: *collector
    command: ["--config", "/common/raw-sink-a.yaml"]
    volumes: ["${PIPELINES:-./latency}:/pipelines:ro", "${COMMON:-./common}:/common:ro"]
    cpuset: "${CPU_RAW_SINK_A:-14}"
    depends_on: [prometheus, loki-raw]
  raw-sink-b:
    <<: *collector
    command: ["--config", "/common/raw-sink-b.yaml"]
    volumes: ["${PIPELINES:-./latency}:/pipelines:ro", "${COMMON:-./common}:/common:ro"]
    cpuset: "${CPU_RAW_SINK_B:-15}"
    depends_on: [prometheus, loki-raw]
  query-job:
    image: python:3.12-slim
    command: ["python3", "/app/query_job.py"]
    volumes: ["./query_job.py:/app/query_job.py:ro"]
    environment:
      USE_CASE: "${USE_CASE:-latency}"
      WINDOW_SECONDS: "${WINDOW_SECONDS:-60}"
    cpuset: "${CPU_QUERY_JOB:-16}"
    depends_on: [prometheus, loki-raw]
  # Outside the pipelines: compares the sketch and exact top-k answers.
  hh-accuracy:
    <<: *collector
    command: ["--config", "/common/hh-accuracy.yaml"]
    volumes: ["${PIPELINES:-./latency}:/pipelines:ro", "${COMMON:-./common}:/common:ro"]
    cpuset: "${CPU_HH_ACCURACY:-17}"
    depends_on: [prometheus]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  # The raw pipeline's store, apart from the Loki with the events.
  loki-raw:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/loki-raw.yaml"]
    ports: ["127.0.0.1:${LOKI_RAW_PORT:-3101}:3100"]
    volumes: ["./loki-raw.yaml:/etc/loki/loki-raw.yaml:ro"]
    mem_limit: "${LOKI_RAW_MEMORY:-16g}"
  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports: ["127.0.0.1:${LOKI_PORT:-3100}:3100"]
