# Store of the raw pipeline: one log record per raw point. Limits are raised
# so that ingestion speed, not a rate limit, decides what the pipeline sees.
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_server_max_recv_msg_size: 1073741824
  http_server_read_timeout: 5m
  http_server_write_timeout: 5m
common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  ingestion_rate_mb: 1024
  ingestion_burst_size_mb: 2048
  per_stream_rate_limit: 1GB
  per_stream_rate_limit_burst: 2GB
  reject_old_samples: false
  max_structured_metadata_entries_count: 512
  # The query job groups by an attribute: up to a million routes (top-k) or
  # every user.id of a window (cardinality, about 10 million at the top rate).
  max_query_series: 20000000
  query_timeout: 5m
  # Only the latest windows are queried; keep 2 h so a long-running demo does
  # not fill the disk (about 3 GB per hour at the top rate).
  retention_period: 2h
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 10m
  delete_request_store: filesystem
analytics:
  reporting_enabled: false
