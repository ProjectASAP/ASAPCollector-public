# Source b: requests from client addresses (IPv4) drawn Zipf(1.0) over 20
# million addresses, the "top talkers" question: about 1 million distinct
# addresses per 5 minutes at the lowest rate, about 7 million at the highest.
# The rate per source ramps up and back down every 40 minutes, again and again:
# 5k -> 10k -> 20k -> 40k -> 80k -> 40k -> 20k -> 10k points/s, 5 minutes each.
# Once: a new client (203.0.113.7) takes 15% of traffic at minute 10.
version: otel_dataflow/v1
engine:
  http_admin:
    bind_address: 0.0.0.0:8085
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
groups:
  default:
    pipelines:
      main:
        nodes:
          generator:
            type: urn:asap:receiver:scenario_generator
            config:
              seed: 2
              signals_per_second: 5000
              metric_name: http.server.request.duration
              resource_attributes: {service.name: checkout, source: "b"}
              attributes:
                - {key: client.address, cardinality: 20000000, zipf: 1.0, ipv4: true}
              value: {lognormal: {median: 50.0, sigma: 0.6}}
              # The rate ramps up and back down every 40 minutes, again and again.
              rate_cycle_seconds: 2400
              changes:
                - {after_seconds: 600, attribute: client.address, inject: 203.0.113.7, share: 0.15}
                - {after_seconds: 300, signals_per_second: 10000}
                - {after_seconds: 600, signals_per_second: 20000}
                - {after_seconds: 900, signals_per_second: 40000}
                - {after_seconds: 1200, signals_per_second: 80000}
                - {after_seconds: 1500, signals_per_second: 40000}
                - {after_seconds: 1800, signals_per_second: 20000}
                - {after_seconds: 2100, signals_per_second: 10000}
          export:
            type: exporter:otlp_http
            config:
              endpoint: http://downstream:4318
              client_pool_size: 1
              max_in_flight: 1
              http: {timeout: 30s, compression: none}
        connections:
          - {from: generator, to: export}
