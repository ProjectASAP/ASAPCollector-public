# Exact pipeline, end: exact answers and events of each merged window, the
# ground truth (method="exact"). A copy of the answers goes to hh-accuracy.
version: otel_dataflow/v1
engine:
  http_admin:
    bind_address: 0.0.0.0:8085
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
groups:
  default:
    pipelines:
      main:
        nodes:
          receiver:
            type: receiver:otlp
            config:
              protocols:
                http: {listening_addr: "0.0.0.0:4318", wait_for_result: false, max_request_body_size: 1GiB}
          detector:
            type: urn:asap:processor:exact_detector
            config: {k: 20, novelty_windows: 10}
          fanout:
            type: processor:fanout
            outputs: [answers, accuracy]
            config:
              destinations:
                - {port: answers}
                - {port: accuracy}
          to_prometheus:
            type: exporter:otlp_http
            config:
              endpoint: http://prometheus:9090
              metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
              logs_endpoint: http://loki:3100/otlp/v1/logs
              client_pool_size: 1
              max_in_flight: 1
              http: {timeout: 30s, compression: none}
          to_accuracy:
            type: exporter:otlp_http
            config:
              endpoint: http://hh-accuracy:4318
              client_pool_size: 1
              max_in_flight: 1
              http: {timeout: 30s, compression: none}
        connections:
          - {from: receiver, to: detector}
          - {from: detector, to: fanout}
          - {from: 'fanout["answers"]', to: to_prometheus}
          - {from: 'fanout["accuracy"]', to: to_accuracy}
