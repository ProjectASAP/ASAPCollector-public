# Stage 1 at each source: one Count-Min sketch + top-10 heap of routes per
# 1-minute window goes to merge; the raw points are copied to the exact baseline.
version: otel_dataflow/v1
engine:
  http_admin:
    bind_address: 0.0.0.0:8085
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
groups:
  default:
    pipelines:
      main:
        nodes:
          receiver:
            type: receiver:otlp
            config:
              protocols:
                http: {listening_addr: "0.0.0.0:4318", wait_for_result: false}
          fanout:
            type: processor:fanout
            outputs: [sketch, raw]
            config:
              destinations:
                - {port: sketch}
                - {port: raw}
          sketch:
            type: urn:asap:processor:asap_sketches
            config:
              sketch_type: countminsketch_heap
              window_size: 60s
              output_metric_name: http.server.request.duration
              per_attribute: [http.route]
              omit_resource_attrs: true
              sketch_params: {rows: 4, columns: 2048, k: 10}
          to_merge:
            type: exporter:otlp_http
            config:
              endpoint: http://merge:4318
              client_pool_size: 1
              max_in_flight: 1
              http: {timeout: 30s, compression: none}
          to_exact:
            type: exporter:otlp_http
            config:
              endpoint: http://exact:4318
              client_pool_size: 1
              max_in_flight: 1
              http: {timeout: 30s, compression: none}
        connections:
          - {from: receiver, to: fanout}
          - {from: 'fanout["sketch"]', to: sketch}
          - {from: sketch, to: to_merge}
          - {from: 'fanout["raw"]', to: to_exact}
