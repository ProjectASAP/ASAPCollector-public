global:
  scrape_interval: 5s
scrape_configs:
  # Each collector's own engine telemetry: CPU time per pipeline, RSS, and
  # per-node message and payload counters. stage = the compose service.
  - job_name: collectors
    metrics_path: /api/v1/metrics
    params: {format: [prometheus]}
    static_configs:
      - targets: [generator-a:8085, generator-b:8085, branch-a:8085, branch-b:8085,
                  merge:8085, detector:8085, exact:8085]
    relabel_configs:
      - source_labels: [__address__]
        regex: (.+):8085
        target_label: stage
# Answers (sketch and exact) arrive through the OTLP receiver.
