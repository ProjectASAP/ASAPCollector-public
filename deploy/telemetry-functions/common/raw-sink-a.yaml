# Raw pipeline (store and query), source a: the only stage. Writes every raw
# point unchanged to its own Prometheus (prometheus-raw, OTLP), with a
# point_slot label so points of one series at the same millisecond stay apart,
# and reports per window when prometheus-raw acknowledged its last point
# (asap.answer.delay, method="raw", source="a") and each point's time from
# event to acknowledgement (asap.raw.transit), to the monitoring Prometheus.
# The query job computes the answer from prometheus-raw with PromQL.
version: otel_dataflow/v1
engine:
  http_admin:
    bind_address: 0.0.0.0:8085
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
groups:
  default:
    pipelines:
      main:
        nodes:
          receiver:
            type: receiver:otlp
            config:
              protocols:
                http: {listening_addr: "0.0.0.0:4318", wait_for_result: false}
          sink:
            type: urn:asap:processor:raw_sink
            outputs: [metrics, latency]
            config: {window: 60s, grace: 5s, labels: {source: "a"}}
          to_prometheus_raw:
            type: exporter:otlp_http
            config:
              endpoint: http://prometheus-raw:9090
              metrics_endpoint: http://prometheus-raw:9090/api/v1/otlp/v1/metrics
              client_pool_size: 4
              max_in_flight: 4
              http: {timeout: 30s, compression: none}
          to_prometheus:
            type: exporter:otlp_http
            config:
              endpoint: http://prometheus:9090
              metrics_endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
              client_pool_size: 1
              max_in_flight: 1
              http: {timeout: 30s, compression: none}
        connections:
          - {from: receiver, to: sink}
          - {from: 'sink["metrics"]', to: to_prometheus_raw}
          - {from: 'sink["latency"]', to: to_prometheus}
