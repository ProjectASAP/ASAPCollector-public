# Exact pipeline, stage 2: add up both sources' exact windows as soon as both
# sent a window (5 s timeout).
version: otel_dataflow/v1
engine:
  http_admin:
    bind_address: 0.0.0.0:8085
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
groups:
  default:
    pipelines:
      main:
        nodes:
          receiver:
            type: receiver:otlp
            config:
              protocols:
                http: {listening_addr: "0.0.0.0:4318", wait_for_result: false, max_request_body_size: 1GiB}
          merge:
            type: urn:asap:processor:exact_merge
            config: {sources: 2, grace: 5s}
          to_detector:
            type: exporter:otlp_http
            config:
              endpoint: http://exact-detector:4318
              client_pool_size: 1
              max_in_flight: 1
              http: {timeout: 30s, compression: none}
        connections:
          - {from: receiver, to: merge}
          - {from: merge, to: to_detector}
