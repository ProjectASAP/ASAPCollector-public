# Sketch pipeline, stage 1 at each source: one KLL per route per 1-minute
# window goes to merge.
version: otel_dataflow/v1
engine:
  http_admin:
    bind_address: 0.0.0.0:8085
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
groups:
  default:
    pipelines:
      main:
        nodes:
          receiver:
            type: receiver:otlp
            config:
              protocols:
                http: {listening_addr: "0.0.0.0:4318", wait_for_result: false}
          sketch:
            type: urn:asap:processor:asap_sketches
            config:
              sketch_type: kll
              window_size: 60s
              output_metric_name: http.server.request.duration
              aggregate_by: [http.route]
              omit_resource_attrs: true
              sketch_params: {k: 200}
          to_merge:
            type: exporter:otlp_http
            config:
              endpoint: http://merge:4318
              client_pool_size: 1
              max_in_flight: 1
              http: {timeout: 30s, compression: none}
        connections:
          - {from: receiver, to: sketch}
          - {from: sketch, to: to_merge}
