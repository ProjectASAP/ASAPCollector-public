# `asap_sketches_registry` — OTAP-side `linkme` distributed-slice
# registration crate for the unified `asap_sketches` processor plugin.
#
# A small overlay applied onto the OTAP Dataflow workspace at build
# time that brings the `OTAP_PROCESSOR_FACTORIES` registration for the
# ASAP precompute plugin into the binary's link scope.
#
# The Cargo manifest is intentionally minimal. Heavy lifting (the
# Tokio lifecycle, codec, 5-sketch dispatch) lives in
# `asap-precompute-rs`; this crate is the linkme registration entry +
# the thin OTAP `local::Processor<OtapPdata>` adapter that bridges
# OTAP's `OtapPdata` shape onto `AsapSketchesPlugin`.
#
# Dependency notes:
#
# - `asap-precompute-rs` is path-deped from the staged location.
#   `build_asap_otap.sh` copies this manifest to
#   `<repo>/otel-arrow/rust/otap-dataflow/crates/asap-sketches-registry/Cargo.toml`
#   at build time — five levels deep from the repo root, so the
#   relative path back to `asap-precompute-rs/` is five `../` hops.
# - `linkme` / `otel-arrow-dfe-engine` / `otel-arrow-dfe-otap` /
#   `otel-arrow-dfe-config` / `otel-arrow-dfe-pdata` /
#   `otel-arrow-dfe-pdata-views` / `arrow-*` are all taken from the OTAP
#   workspace via `workspace = true` so the versions track the upstream
#   submodule's pin (avoids the "two distinct versions of linkme [or
#   arrow-array] in the binary" failure mode — see otap_bridge.rs's
#   module doc for why the arrow-array version specifically has to be
#   the literal same one `asap-precompute-rs` resolves to).
#
# Package names here use the `otel-arrow-dfe-*` prefix (not the older
# `otap-df-*` one asap-precompute-rs's own docs sometimes reference) —
# upstream renamed these very recently (otel-arrow issue #1848,
# `.chloggen/otel-arrow-dfe-crate-prefix.yaml`, unreleased as of
# otel-arrow@3e85c34). If the actual pinned commit `build_asap_otap.sh`
# checks out predates that rename, these names (and `otap_bridge.rs`'s
# `otel_arrow_dfe_*` imports) need reverting to `otap-df-*` /
# `otap_df_*`.

[package]
name = "asap_sketches_registry"
version = "0.1.0"
edition = "2024"
description = "OTAP-Rust linkme distributed-slice registration for the ASAP unified `asap_sketches` processor"
license = "MIT"
publish = false

# Single library file; named `mod.rs` rather than `lib.rs` to match the
# `otap-patch/all/mod.rs` path the overlay layout calls out.
[lib]
name = "asap_sketches_registry"
path = "mod.rs"

[dependencies]
# Path-dep injected at staging time by `build_asap_otap.sh`. The
# literal path here resolves once the crate is copied into
# `<otap>/crates/asap-sketches-registry/` — five levels deep from
# the repo root (`<repo>/otel-arrow/rust/otap-dataflow/crates/asap-sketches-registry`),
# so five `../` hops land back at the repo root.
asap-precompute-rs = { path = "../../../../../asap-precompute-rs", features = ["otap"] }

# Pulled from the OTAP workspace so the linkme version matches the
# binary's. Mismatched linkme versions cause silent registration
# misses.
linkme = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
humantime-serde = { workspace = true }

otel-arrow-dfe-engine = { workspace = true }
otel-arrow-dfe-otap = { workspace = true }
otel-arrow-dfe-config = { workspace = true }

# For otap_bridge.rs's OtapMetricRecords <-> real OtapArrowRecords
# conversion: reading real metric batches (otel-arrow-dfe-pdata-views'
# MetricsView trait family) and building them
# (otel-arrow-dfe-pdata::encode::encode_metrics_otap_batch).
otel-arrow-dfe-pdata = { workspace = true }
otel-arrow-dfe-pdata-views = { workspace = true }
thiserror = { workspace = true }

# Must resolve to the same version asap-precompute-rs's own `arrow-*`
# deps do (both pinned "58.3") — see otap_bridge.rs's module doc.
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
