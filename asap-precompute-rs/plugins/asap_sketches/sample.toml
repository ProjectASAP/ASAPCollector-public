# ASAP `asap_sketches` plugin — canonical sample configuration.
#
# One [[pipelines.metrics.processors]] block per ASAP precompute. The
# plugin is parameterized by `sketch_type`; multi-sketch deployments
# declare multiple blocks with different `id` + `sketch_type` values.
#
# Registered under urn:asap:processor:asap_sketches
# (asap-precompute-rs/src/otap/processor.rs, `otap-engine` feature).

[[pipelines.metrics.processors]]
id     = "asap_kll"
plugin = "asap_sketches"

  [pipelines.metrics.processors.config]
  ## Sketch algorithm — one of:
  ##   "ddsketch"         (quantiles, relative-error)
  ##   "kll"              (quantiles, rank-error)
  ##   "hll"              (cardinality)
  ##   "countsketch"      (frequency)
  ##   "countminsketch"   (frequency, biased upward)
  ##   "countminsketch_heap" (frequency plus top-k heavy hitters)
  sketch_type = "kll"

  ## Window size. Rust duration string, parsed via humantime;
  ## passed verbatim into `PrecomputeConfig::window`.
  window_size = "10s"
  # window_slide = "5s"      # KLL rolling lookback of 10s, emit every 5s
  # Set transmit_sketch=false for overlapping sliding windows. Equal size
  # and slide can transmit full disjoint panes for downstream merging.

  ## Output metric name stamped onto every emitted envelope.
  output_metric_name = "http_request_duration_ms"

  ## Aggregation-plan join key. Creation, merge, and estimate processors in
  ## one logical dataflow must use the same value.
  agg_id = 7

  ## Output and series controls. Creation and merge processors keep
  ## transmit_sketch=true. An estimation processor sets it to false and
  ## supplies quantiles (DDSketch/KLL) instead. Sketches travel as the
  ## self-describing ASAPv1 envelope from asap_sketchlib, always full state.
  transmit_sketch = true
  # quantiles = [0.5, 0.99]
  # default_key = "fallback"   # CountSketch only
  # omit_resource_attrs = false
  # global_aggregation = false
  # emit_window_stats = false

  ## Sketch-specific tuning knobs. Only the keys relevant to
  ## `sketch_type` are read; others are ignored.
  [pipelines.metrics.processors.config.sketch_params]
  k = 200                    # kll — buffer size
  # relative_accuracy = 0.01 # ddsketch estimate mode — relative error
  # width = 2048             # countsketch / countminsketch — width
  # depth = 4                # countsketch / countminsketch — depth
  # rows = 4                 # countminsketch_heap — rows
  # columns = 2048           # countminsketch_heap — columns
  # k = 10                   # countminsketch_heap — heap size (default 10)
