name: Feature request
description: A change to existing behavior, tooling or docs.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For a new sketch function or use case, use the capability form.
        For a long or cross-cutting design, write an RFC in docs/rfcs.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe it as before -> after.
    validations:
      required: true
  - type: textarea
    id: performance
    attributes:
      label: Expected performance impact
      description: Effect on throughput, CPU, memory or latency, or "none".
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
