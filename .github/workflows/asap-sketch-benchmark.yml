name: ASAP sketch benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/asap-sketch-benchmark.yml"
      - "asap-precompute-rs/**"
      - "benchmarks/**"
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

concurrency:
  group: asap-sketch-nightly
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: asap-precompute-rs
      - name: Run official OTAP pipeline_perf_test suite
        run: ./benchmarks/run-nightly.sh
      - name: Verify completed traffic
        run: |
          for scenario in raw exact kll; do
            source "benchmark-results/$scenario/throughput.env"
            test "$input_signals" -gt 0
            test "$signals_per_second" -gt 0
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for scenario in ("raw", "exact", "kll"):
              root = Path("benchmark-results") / scenario
              config = json.loads((root / "config.json").read_text())
              stages = json.loads((root / "stages.json").read_text())["stages"]
              assert set(stages) == {"a", "b", "sa", "sb", "merged", "out"}
              assert set(config["generator_cores"].split(",")).isdisjoint(config["processor_cores"].split(","))
              assert config["debug_disabled"]
              assert all(stage["input_count"] > 0 for stage in stages.values())
          sweep = Path("benchmark-results/scale-sweep")
          rows = json.loads((sweep / "summary.json").read_text())
          resources = json.loads((sweep / "resources.json").read_text())
          assert len(rows) == 12
          assert len(resources) == 72
          assert all(row["repetitions"] == 2 and row["median_signals_per_second"] > 0 for row in rows)
          for chart in ("throughput.svg", "raw-resources.svg", "exact-resources.svg", "kll-resources.svg"):
              assert (sweep / chart).is_file()
          PY
      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asap-sketch-benchmark-${{ github.run_id }}
          path: |
            benchmark-results/
          retention-days: 30
